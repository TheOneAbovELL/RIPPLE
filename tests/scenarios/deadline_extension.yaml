name: deadline_extension
description: An edited JD deadline updates its reminder and nothing about other openings.
memories:
  acme_deadline: {kind: opening, content: "Acme deadline 2026-11-05", structured: {subject: acme, attribute: deadline, value: "2026-11-05"}}
  acme_reminder: {kind: derived, content: "remind on 2026-11-03 about Acme"}
  globex_reminder: {kind: derived, content: "remind on 2026-11-10 about Globex"}
  globex_deadline: {kind: opening, content: "Globex deadline 2026-11-12", structured: {subject: globex, attribute: deadline, value: "2026-11-12"}}
links:
  - [acme_deadline, acme_reminder, reminder_for]
  - [globex_deadline, globex_reminder, reminder_for]
resolutions:
  acme_reminder: {action: update, new_content: "remind on 2026-11-17 about Acme"}
events:
  - update: acme_deadline
    content: "Acme deadline 2026-11-19"
    structured: {subject: acme, attribute: deadline, value: "2026-11-19"}
    expect:
      acme_reminder@latest: {version: 2, content: "remind on 2026-11-17 about Acme"}
      globex_reminder: {status: VALID, version: 1}
