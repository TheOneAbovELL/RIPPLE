# I8 allow-list (ADR-0111). Numbers the detector flags that are not results: targets,
# example inputs, worked examples of a metric definition, configuration constants,
# versions. Every entry has a reason and a source. A text entry matches the flagged span
# exactly, in the named path, on a line holding `context`; an entry that matches nothing
# is reported as stale. A real result never goes here: it is a macro, a citation of its
# results/ folder, or a line in i8_known_violations.toml.

