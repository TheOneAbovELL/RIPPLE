name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"

jobs:
  checks:
    name: lint, types, fast tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -m "not slow"
      - name: compose files are valid
        run: |
          docker compose -f infra/docker-compose.yml config -q
          RIPPLE_IMAGE=ripple:ci POSTGRES_PASSWORD=x RIPPLE_DOMAIN=example.test ACME_EMAIL=a@b.c \
            docker compose -f infra/docker-compose.prod.yml config -q
      - name: bench smoke (informational until WaveEngine exists; results uploaded)
        run: uv run python -m bench.run --suite smoke || echo "smoke suite reported failures (expected while the engine is a stub)"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: results/
          if-no-files-found: ignore

  services:
    name: migrations and slow tests against postgres and redis
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        # Must match infra/docker-compose*.yml; pin all to the same <pgvector>-pg17 tag
        # once the author's first `docker pull` confirms it.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ripple
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: ripple
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ripple -d ripple"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # CI's database is throwaway, so the migration test may downgrade it to base.
      DATABASE_URL: postgresql+psycopg://ripple:change-me@localhost:5432/ripple
      TEST_DATABASE_URL: postgresql+psycopg://ripple:change-me@localhost:5432/ripple
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync
      - run: uv run alembic upgrade head
      - run: uv run pytest -m slow

  web:
    name: dashboard lint, tests, static export
    runs-on: ubuntu-latest
    needs: checks
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: skip when the dashboard does not exist yet
        id: present
        run: test -f package.json && echo "ok=true" >> "$GITHUB_OUTPUT" || echo "ok=false" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.ok == 'true'
        run: npm ci
      - if: steps.present.outputs.ok == 'true'
        run: npm run lint
      - if: steps.present.outputs.ok == 'true'
        run: npm test -- --run
      - if: steps.present.outputs.ok == 'true'
        run: npm run build
      - if: steps.present.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/out

  image:
    name: docker image (build; publish to GHCR on main and tags)
    runs-on: ubuntu-latest
    needs: [checks, services]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
