# Alembic configuration (ADR-0016). The database URL is read from DATABASE_URL in
# infra/migrations/env.py; sqlalchemy.url is intentionally absent here.
# %(here)s makes the paths relative to this file, not to the working directory.
[alembic]
script_location = %(here)s/infra/migrations
prepend_sys_path = %(here)s/src
file_template = %%(rev)s_%%(slug)s
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
